<template>
  <lightning-tabset variant="vertical">
    <lightning-tab label="Builder" icon-name="utility:event">
      <c-schedule-calendar
        oneventsupdated={handleEventsUpdated}
        onfiltersupdated={handleFiltersUpdated}
      ></c-schedule-calendar>
    </lightning-tab>

    <lightning-tab label="Gantt" icon-name="utility:table">
      <c-gantt-arena-view
        current-date={currentDate}
        events={events}
        selected-filters={selectedFilters}
        oneventclick={handleEventSelected}
      ></c-gantt-arena-view>
    </lightning-tab>

    <lightning-tab label="Tryouts" icon-name="utility:people">
      <c-tryout-manager></c-tryout-manager>
    </lightning-tab>

    <lightning-tab label="Statistics" icon-name="utility:chart">
      <c-statistics-dashboard></c-statistics-dashboard>
    </lightning-tab>
  </lightning-tabset>
</template>
