<template>
  <div class="day-calendar-view">
    <!-- Header with date -->
    <div class="calendar-header">
      <h2 class="day-title">{dayDisplay}</h2>
    </div>

    <!-- Main calendar grid -->
    <div class="day-scroll-container">
      <div class="calendar-grid">
        <!-- Time column -->
        <div class="time-column">
          <template for:each={timeSlots} for:item="slot">
            <div key={slot} class="time-slot-label">
              <span class="time-text">{slot}</span>
            </div>
          </template>
        </div>

        <!-- Arena columns -->
        <div class="arena-columns">
          <template for:each={arenaColumns} for:item="arena">
            <div key={arena.key} class="arena-column" data-arena={arena.name}>
              <!-- Arena header -->
              <div class="arena-header">
                <span class="arena-name">{arena.name}</span>
              </div>

              <!-- Time slot cells (clickable) -->
              <template
                for:each={timeSlots}
                for:item="slot"
                for:index="slotIndex"
              >
                <div
                  key={slot}
                  class="time-slot-cell"
                  data-arena-index={arena.index}
                  data-slot-index={slotIndex}
                  data-slot={slot}
                  onclick={handleTimeSlotClick}
                  ondragover={handleDragOver}
                  ondragleave={handleDragLeave}
                  ondrop={handleEventDrop}
                  role="button"
                  tabindex="0"
                  aria-label="Time slot {slot}"
                ></div>
              </template>

              <!-- Event blocks (positioned absolutely) -->
              <template for:each={arena.events} for:item="event">
                <div
                  key={event.id}
                  class={event.cssClass}
                  data-event-id={event.id}
                  data-arena={arena.name}
                  data-top={event.top}
                  data-height={event.height}
                  draggable="true"
                  onclick={handleEventClick}
                  ondragstart={handleEventDragStart}
                  role="button"
                  tabindex="0"
                  aria-label={event.title}
                >
                  <div class="event-content">
                    <div class="event-title">{event.title}</div>
                    <div class="event-time">
                      {event.startTime} - {event.endTime}
                    </div>
                    <template if:true={event.hasConflict}>
                      <div class="event-conflict-indicator">
                        <lightning-icon
                          icon-name="utility:warning"
                          size="x-small"
                        ></lightning-icon>
                        Conflict
                      </div>
                    </template>
                  </div>
                </div>
              </template>

              <!-- Current time indicator (visible only for today) -->
              <template if:true={isToday}>
                <div class="current-time-indicator">
                  <span class="current-time-label"></span>
                </div>
              </template>
            </div>
          </template>
        </div>
      </div>
    </div>

    <!-- Quick-create form overlay -->
    <template if:true={quickCreateSlot}>
      <div class="quick-create-overlay">
        <div class="quick-create-form">
          <div class="form-header">
            <h3>Create Event</h3>
            <lightning-button-icon
              icon-name="utility:close"
              variant="bare"
              alternative-text="Close form"
              title="Close"
              aria-label="Close quick create form"
              onclick={handleQuickCreateCancel}
            ></lightning-button-icon>
          </div>

          <div class="form-content">
            <lightning-input
              type="text"
              label="Event Title"
              placeholder="Enter event title"
              class="form-field"
              data-field="title"
            ></lightning-input>

            <lightning-combobox
              label="Event Type"
              options={eventTypeOptions}
              class="form-field"
              data-field="type"
            ></lightning-combobox>

            <lightning-input
              type="time"
              label="Start Time"
              class="form-field"
              data-field="start"
            ></lightning-input>

            <lightning-input
              type="time"
              label="End Time"
              class="form-field"
              data-field="end"
            ></lightning-input>

            <div class="form-actions">
              <lightning-button
                label="Create"
                variant="brand"
                onclick={handleQuickCreateSubmit}
              ></lightning-button>
              <lightning-button
                label="Cancel"
                variant="neutral"
                onclick={handleQuickCreateCancel}
                class="quick-create-cancel"
              ></lightning-button>
            </div>
          </div>
        </div>
      </div>
    </template>
  </div>
</template>
