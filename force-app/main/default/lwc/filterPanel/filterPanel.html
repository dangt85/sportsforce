<template>
  <lightning-card class="filter-panel-card">
    <!-- Filter Header -->
    <div slot="title" class="filter-header">
      <h3 class="slds-text-heading--small">Filters</h3>
      <span class="filter-count slds-text-body--small slds-text-color--success">
        {filterCountText}
      </span>
    </div>

    <!-- Filters Grid -->
    <lightning-layout multiple-rows="true" class="filter-grid">
      <!-- Teams Filter -->
      <lightning-layout-item
        size="12"
        medium-device-size="6"
        large-device-size="3"
        class="filter-item"
      >
        <lightning-combobox
          data-filter="teams"
          name="teams"
          label="Teams"
          placeholder="Select teams..."
          options={teamOptions}
          value={selectedTeams}
          onchange={handleTeamChange}
        ></lightning-combobox>
      </lightning-layout-item>

      <!-- Event Types Filter -->
      <lightning-layout-item
        size="12"
        medium-device-size="6"
        large-device-size="3"
        class="filter-item"
      >
        <lightning-combobox
          data-filter="eventTypes"
          name="eventTypes"
          label="Event Types"
          placeholder="Select event types..."
          options={eventTypeOptions}
          value={selectedEventTypes}
          onchange={handleEventTypeChange}
        ></lightning-combobox>
      </lightning-layout-item>

      <!-- Arenas Filter -->
      <lightning-layout-item
        size="12"
        medium-device-size="6"
        large-device-size="3"
        class="filter-item"
      >
        <lightning-combobox
          data-filter="arenas"
          name="arenas"
          label="Arenas"
          placeholder="Select arenas..."
          options={arenaOptions}
          value={selectedArenas}
          onchange={handleArenaChange}
        ></lightning-combobox>
      </lightning-layout-item>

      <!-- Divisions Filter -->
      <lightning-layout-item
        size="12"
        medium-device-size="6"
        large-device-size="3"
        class="filter-item"
      >
        <lightning-combobox
          data-filter="divisions"
          name="divisions"
          label="Divisions"
          placeholder="Select divisions..."
          options={divisionOptions}
          value={selectedDivisions}
          onchange={handleDivisionChange}
        ></lightning-combobox>
      </lightning-layout-item>
    </lightning-layout>

    <!-- Clear Filters Button -->
    <div slot="footer" class="filter-footer">
      <lightning-button
        data-action="clear"
        variant="neutral"
        label="Clear All Filters"
        icon-name="utility:slash-list"
        icon-position="left"
        disabled={isClearButtonDisabled}
        onclick={handleClearFilters}
        title="Clear all active filters"
      ></lightning-button>
    </div>
  </lightning-card>
</template>
