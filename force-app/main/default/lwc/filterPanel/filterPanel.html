<template>
  <div class="slds-box filter-panel">
    <!-- Filter Header -->
    <div class="slds-grid slds-grid--align-spread slds-m-bottom--medium">
      <div>
        <h3 class="slds-text-heading--small">Filters</h3>
      </div>
      <div class="filter-count slds-text-body--small slds-text-color--success">
        <span>{filterCountText}</span>
      </div>
    </div>

    <!-- Filters Grid -->
    <div class="slds-grid slds-wrap slds-grid--pull-padded filter-grid">
      <!-- Teams Filter -->
      <div
        class="slds-col slds-size--1-of-1 slds-medium-size--1-of-2 slds-large-size--1-of-4 slds-p-horizontal--small"
      >
        <div class="slds-form-element">
          <label class="slds-form-element__label">
            <span class="slds-required-mark">*</span>
            <span>Teams</span>
          </label>
          <div class="slds-form-element__control">
            <lightning-combobox
              data-filter="teams"
              name="teams"
              label=""
              placeholder="Select teams..."
              options={teamOptions}
              value={selectedTeams}
              onchange={handleTeamChange}
            ></lightning-combobox>
          </div>
        </div>
      </div>

      <!-- Event Types Filter -->
      <div
        class="slds-col slds-size--1-of-1 slds-medium-size--1-of-2 slds-large-size--1-of-4 slds-p-horizontal--small"
      >
        <div class="slds-form-element">
          <label class="slds-form-element__label">
            <span class="slds-required-mark">*</span>
            <span>Event Types</span>
          </label>
          <div class="slds-form-element__control">
            <lightning-combobox
              data-filter="eventTypes"
              name="eventTypes"
              label=""
              placeholder="Select event types..."
              options={eventTypeOptions}
              value={selectedEventTypes}
              onchange={handleEventTypeChange}
            ></lightning-combobox>
          </div>
        </div>
      </div>

      <!-- Arenas Filter -->
      <div
        class="slds-col slds-size--1-of-1 slds-medium-size--1-of-2 slds-large-size--1-of-4 slds-p-horizontal--small"
      >
        <div class="slds-form-element">
          <label class="slds-form-element__label">
            <span class="slds-required-mark">*</span>
            <span>Arenas</span>
          </label>
          <div class="slds-form-element__control">
            <lightning-combobox
              data-filter="arenas"
              name="arenas"
              label=""
              placeholder="Select arenas..."
              options={arenaOptions}
              value={selectedArenas}
              onchange={handleArenaChange}
            ></lightning-combobox>
          </div>
        </div>
      </div>

      <!-- Divisions Filter -->
      <div
        class="slds-col slds-size--1-of-1 slds-medium-size--1-of-2 slds-large-size--1-of-4 slds-p-horizontal--small"
      >
        <div class="slds-form-element">
          <label class="slds-form-element__label">
            <span class="slds-required-mark">*</span>
            <span>Divisions</span>
          </label>
          <div class="slds-form-element__control">
            <lightning-combobox
              data-filter="divisions"
              name="divisions"
              label=""
              placeholder="Select divisions..."
              options={divisionOptions}
              value={selectedDivisions}
              onchange={handleDivisionChange}
            ></lightning-combobox>
          </div>
        </div>
      </div>
    </div>

    <!-- Clear Filters Button -->
    <div class="slds-m-top--medium slds-border-top--thin slds-p-top--medium">
      <button
        data-action="clear"
        class="slds-button slds-button--neutral"
        disabled={isClearButtonDisabled}
        onclick={handleClearFilters}
        aria-label="Clear all filters"
      >
        <lightning-icon
          icon-name="utility-slash-list"
          size="x-small"
          class="slds-m-right--x-small"
        ></lightning-icon>
        Clear All Filters
      </button>
    </div>
  </div>
</template>
