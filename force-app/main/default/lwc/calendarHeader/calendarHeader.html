<template>
  <div class="slds-page-header slds-page-header--record-home">
    <div class="slds-page-header__row">
      <div class="slds-page-header__col-title">
        <h1 class="slds-page-header__title calendar-header-title">
          {displayMonthYear}
        </h1>
      </div>
      <div class="slds-page-header__col-actions">
        <!-- Navigation Controls -->
        <div class="slds-button-group" role="group">
          <lightning-button
            variant="neutral"
            icon-name="utility:chevronleft"
            icon-position="left"
            aria-label="Previous"
            data-action="prev"
            onclick={handlePreviousPeriod}
            title="Previous period"
          ></lightning-button>

          <lightning-button
            variant="neutral"
            label="Today"
            data-action="today"
            onclick={handleTodayClick}
            title="Jump to today"
          ></lightning-button>

          <lightning-button
            variant="neutral"
            icon-name="utility:chevronright"
            icon-position="right"
            aria-label="Next"
            data-action="next"
            onclick={handleNextPeriod}
            title="Next period"
          ></lightning-button>
        </div>

        <!-- Date Picker -->
        <lightning-input
          type="date"
          variant="label-hidden"
          class="date-picker-input"
          value={dateInputValue}
          onchange={handleDatePickerChange}
          label="Jump to date"
          title="Jump to date"
        ></lightning-input>
      </div>
    </div>

    <!-- View Selector -->
    <div class="slds-page-header__row view-selector-row">
      <div class="slds-page-header__col-title">
        <div
          class="slds-button-group"
          role="group"
          aria-label="Calendar view selection"
        >
          <lightning-button
            variant={monthButtonVariant}
            label="Month"
            data-view="month"
            title="Month view"
            onclick={handleViewChange}
          ></lightning-button>
          <lightning-button
            variant={weekButtonVariant}
            label="Week"
            data-view="week"
            title="Week view"
            onclick={handleViewChange}
          ></lightning-button>
          <lightning-button
            variant={dayButtonVariant}
            label="Day"
            data-view="day"
            title="Day view"
            onclick={handleViewChange}
          ></lightning-button>
          <lightning-button
            variant={ganttButtonVariant}
            label="Gantt"
            data-view="gantt"
            title="Arena utilization view"
            onclick={handleViewChange}
          ></lightning-button>
        </div>
      </div>

      <div class="slds-page-header__col-actions">
        <!-- Settings Button -->
        <lightning-button-icon
          icon-name="utility:settings"
          variant="border-small"
          aria-label="Settings"
          data-action="settings"
          onclick={handleSettingsClick}
          title="Open settings"
        ></lightning-button-icon>
      </div>
    </div>
  </div>
</template>
